# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Java project to Azure Function App - ReceberAvaliacao

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_NAME: ReceberAvaliacao
  JAVA_VERSION: '21'
  RESOURCE_GROUP: ReceberAvaliacao_group

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v7

      - name: Setup Java Sdk ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 'Build and Package with Gradle'
        run: |
          chmod +x gradlew
          ./gradlew test azureFunctionsPackage

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F8A2D81D7C044FC58E1A4ED8B7A1C951 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C2B15201D93E4CBE877C48961CB3C0AE }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F059E2FFD6A345B4A596ADE11C4B3D25 }}

      - name: 'Configure shared database settings'
        uses: azure/CLI@v2
        with:
          inlineScript: |
            for APP in ReceberAvaliacao NotificarUrgencia RelatorioSemanal; do
              az functionapp config appsettings set \
                --name "$APP" \
                --resource-group ReceberAvaliacao_group \
                --settings \
                  DB_URL="${{ secrets.DB_URL }}" \
                  DB_USER="${{ secrets.DB_USER }}" \
                  DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
            done

      - name: 'Deploy fn-receber-avaliacao'
        uses: Azure/functions-action@v1
        with:
          app-name: 'ReceberAvaliacao'
          slot-name: 'Production'
          package: './receber-avaliacao/build/azure-functions/ReceberAvaliacao'

      - name: 'Deploy fn-notificar-urgencia'
        uses: Azure/functions-action@v1
        with:
          app-name: 'NotificarUrgencia'
          slot-name: 'Production'
          package: './notificar-urgencia/build/azure-functions/NotificarUrgencia'

      - name: 'Deploy fn-relatorio-semanal'
        uses: Azure/functions-action@v1
        with:
          app-name: 'RelatorioSemanal'
          slot-name: 'Production'
          package: './relatorio-semanal/build/azure-functions/RelatorioSemanal'
